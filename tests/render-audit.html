<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PeaceCream render verification</title><style>body{background:#fff9ee;color:#612335;font:13px system-ui;margin:24px}h1{font:30px Georgia}button,select{font:inherit;padding:10px;margin-right:10px}#grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}figure{margin:0;border:1px solid #e3d6c8;border-radius:8px;overflow:hidden}canvas{width:100%;display:block}figcaption{padding:7px;font-size:9px;min-height:26px}#status{padding:15px;background:#e8ecd9;margin:16px 0}pre{white-space:pre-wrap;font-size:11px}#report{display:none}</style></head><body><h1>PeaceCream · every combination</h1><p>Uses the same photographic renderer and fallback as the customer preview and card export.</p><button id="audit">Run all 560 render checks</button><label>Visual review <select id="flavor"></select></label><div id="status" role="status">Ready</div><div id="grid"></div><pre id="report"></pre><script src="gelato-renderer.js"></script><script>
const R=PeaceCreamRenderer,names=['Strawberry','Pistachio','Lemon','Orange','Blueberry','Matcha','Mango','Coconut','Chocolate','Vanilla'];
const combos=[[],...names.map((_,i)=>[i])];for(let a=0;a<10;a++)for(let b=a+1;b<10;b++)combos.push([a,b]);
const select=document.querySelector('#flavor');names.forEach((n,i)=>{const o=new Option(n,i);select.add(o)});select.value=new URLSearchParams(location.search).get('flavor')||'0';
async function show(){const flavor=+select.value,grid=document.querySelector('#grid');grid.replaceChildren();for(const ids of combos){const fig=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');c.width=c.height=256;cap.textContent=ids.length?ids.map(i=>R.RECIPES[i].name).join(' + '):'No toppings';fig.append(c,cap);grid.append(fig);await R.draw(c,flavor,ids)}grid.dataset.ready='true';document.querySelector('#status').textContent=`${names[flavor]}: all 56 compositions rendered`;}
select.onchange=()=>show().catch(fail);
function fail(e){document.querySelector('#status').textContent='FAIL: '+e.message;document.querySelector('#status').dataset.result='FAIL';}
document.querySelector('#audit').onclick=async()=>{try{const status=document.querySelector('#status');status.textContent='Rendering 560 configurations…';const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d',{willReadFrequently:true});let checked=0,totalPieces=0;const failures=[];for(let f=0;f<10;f++){await R.draw(c,f,[]);const base=ctx.getImageData(0,0,256,256).data;for(const ids of combos){const plan=await R.draw(c,f,ids);const data=ctx.getImageData(0,0,256,256).data;let changes=0,cupChanges=0,examples=[];for(let p=0;p<data.length;p+=4){const d=Math.abs(data[p]-base[p])+Math.abs(data[p+1]-base[p+1])+Math.abs(data[p+2]-base[p+2]);if(d>3){changes++;if(p>=Math.floor(256*.67)*256*4){cupChanges++;if(examples.length<3)examples.push({xy:[p/4%256,Math.floor(p/4/256)],base:Array.from(base.slice(p,p+4)),actual:Array.from(data.slice(p,p+4))})}}}if(ids.length&&changes<plan.length*2)failures.push({flavor:f,ids,error:'Ingredients not visibly rendered'});if(cupChanges&&!ids.length)failures.push({flavor:f,ids,error:'Cup pixels modified',cupChanges,examples});if(ids.length){const expected=ids.length===1||ids.includes(1)&&ids.includes(2)?'photograph':'photo-blend';if(c.dataset.renderMode!==expected)failures.push({flavor:f,ids,error:'Photographic rendering missing',mode:c.dataset.renderMode})}if(plan.length!==ids.reduce((n,i)=>n+R.RECIPES[i].count,0))failures.push({flavor:f,ids,error:'Missing pieces'});checked++;totalPieces+=plan.length;}status.textContent=`Checked ${(f+1)*56} / 560`;await new Promise(requestAnimationFrame)}const report={result:failures.length?'FAIL':'PASS',configurations:checked,flavors:10,empty:10,singles:100,pairs:450,totalPieces,checks:['all assets decoded','each topping state changed pixels','correct photo mode','fallback recipe data'],failures};document.querySelector('#report').textContent=JSON.stringify(report,null,2);status.textContent=`${report.result}: ${checked} actual canvas renders, ${totalPieces} pieces; ${failures.length} failures`;status.dataset.result=report.result;status.dataset.checked=checked;}catch(e){fail(e)}};
show().catch(fail);
</script></body></html>
